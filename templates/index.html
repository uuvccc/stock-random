<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f8" />
    <title>随机 A 股行情</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        html {
            -webkit-text-size-adjust: 100%;
        }
        body {
            background: #f5f6f8;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC",
                         "Microsoft YaHei", sans-serif;
            color: #222;
            font-size: 15px;
            min-height: 100vh;
        }

        .app {
            max-width: 520px;
            margin: 0 auto;
            padding: 0 14px calc(96px + env(safe-area-inset-bottom));
        }

        /* 吸顶头部，毛玻璃，含顶部安全区 */
        .header {
            position: sticky;
            top: 0;
            z-index: 10;
            margin: 0 -14px;
            padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
            background: rgba(245, 246, 248, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .title {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a1a;
        }
        .subtitle {
            font-size: 12px;
            color: #999;
            margin-top: 2px;
        }
        .hint {
            font-size: 11px;
            color: #bbb;
        }

        /* 右下角悬浮刷新按钮：拇指易触达 */
        .fab {
            position: fixed;
            right: max(16px, env(safe-area-inset-right));
            bottom: calc(20px + env(safe-area-inset-bottom));
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: #1677ff;
            color: #fff;
            font-size: 24px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(22, 119, 255, 0.42);
            z-index: 20;
            transition: transform .12s ease, opacity .15s;
        }
        .fab:active { transform: scale(0.9); }
        .fab[disabled] {
            background: #a8c6f0;
            box-shadow: none;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 80px 0;
            color: #888;
            font-size: 14px;
        }
        .loading .spinner {
            display: inline-block;
            width: 26px; height: 26px;
            border: 3px solid #e0e0e0;
            border-top-color: #1677ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty {
            text-align: center;
            padding: 60px 0;
            color: #aaa;
            font-size: 14px;
        }

        .card {
            background: #fff;
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 12px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
            animation: rise .35s ease both;
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
        }
        .stock-name {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
        }
        .stock-code {
            font-size: 12px;
            color: #999;
            margin-left: 6px;
            font-variant-numeric: tabular-nums;
        }
        .quote { text-align: right; flex-shrink: 0; }
        .price {
            font-size: 22px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        .pct {
            display: inline-block;
            font-size: 13px;
            margin-left: 8px;
            padding: 2px 7px;
            border-radius: 6px;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }
        .up   { color: #e63946; }        /* 涨 -> 红 */
        .down { color: #2ba471; }        /* 跌 -> 绿 */
        .flat { color: #666; }
        .pct.up   { background: rgba(230, 57, 70, 0.08); }
        .pct.down { background: rgba(43, 164, 113, 0.10); }
        .pct.flat { background: #f0f0f0; }

        /* 评分行：星星 + 综合分 + 评级 */
        .rating-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }
        .stars {
            font-size: 15px;
            line-height: 1;
            color: #f5a623;
            letter-spacing: 1.5px;
        }
        .stars .off { color: #e2e2e2; }
        .rating-text {
            font-size: 12px;
            color: #999;
            font-variant-numeric: tabular-nums;
        }

        /* 指标区：每行 标签 | 数值 | 进度条 | 得分 */
        .metrics {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #f1f1f1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .metric {
            display: grid;
            grid-template-columns: 44px minmax(52px, auto) 1fr 40px;
            align-items: center;
            gap: 10px;
            font-size: 12px;
        }
        .metric .label { color: #999; }
        .metric .val {
            color: #333;
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }
        .metric .sub {
            color: #999;
            font-size: 11px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .bar {
            height: 5px;
            background: #f0f0f0;
            border-radius: 3px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            width: 0;
            border-radius: 3px;
            background: linear-gradient(90deg, #ffd27a, #f5a623);
            transition: width .5s ease;
        }

        .na { color: #bbb; font-size: 13px; }
        .na-hint { font-size: 12px; color: #bbb; margin-top: 6px; }

        .footer {
            text-align: center;
            font-size: 11px;
            color: #bbb;
            margin-top: 20px;
        }

        /* ---------- 窄屏（≤380px，如 iPhone SE） ---------- */
        @media (max-width: 380px) {
            .app { padding: 0 10px calc(96px + env(safe-area-inset-bottom)); }
            .header { margin: 0 -10px; padding-left: 10px; padding-right: 10px; }
            .card { padding: 12px; border-radius: 12px; }
            .title { font-size: 17px; }
            .stock-name { font-size: 15px; }
            .price { font-size: 20px; }
            .stars { font-size: 13px; }
            .metric { grid-template-columns: 40px minmax(46px, auto) 1fr 36px; gap: 8px; }
        }

        /* ---------- 深色模式 ---------- */
        @media (prefers-color-scheme: dark) {
            body { background: #121417; color: #e6e6e6; }
            .header { background: rgba(18, 20, 23, 0.85); }
            .title { color: #f0f0f0; }
            .subtitle, .hint { color: #777; }
            .card { background: #1c1f24; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); }
            .stock-name { color: #f0f0f0; }
            .stock-code { color: #777; }
            .up   { color: #ff5c6a; }
            .down { color: #3ddc97; }
            .flat { color: #999; }
            .pct.flat { background: #2a2e34; }
            .metrics { border-top-color: #2a2e34; }
            .metric .label { color: #777; }
            .metric .val { color: #ddd; }
            .metric .sub { color: #777; }
            .bar { background: #2a2e34; }
            .stars .off { color: #3a3f46; }
            .rating-text { color: #777; }
            .loading { color: #777; }
            .loading .spinner { border-color: #2a2e34; border-top-color: #1677ff; }
            .empty { color: #666; }
            .na, .na-hint { color: #555; }
            .footer { color: #555; }
        }

        /* ---------- 减少动效 ---------- */
        @media (prefers-reduced-motion: reduce) {
            .card { animation: none; }
            .bar-fill { transition: none; }
            .fab { transition: none; }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div>
                <div class="title">随机 A 股行情</div>
                <div class="subtitle" id="subtitle">加载中…</div>
            </div>
            <span class="hint">点击右下角换一批</span>
        </div>

        <div id="list"></div>

        <div class="footer">数据来源：东方财富 · 评分＝换手率 70%＋成交量 30% · 仅供学习参考</div>
    </div>

    <button class="fab" id="btn" aria-label="换一批">↻</button>

    <script>
        const btn     = document.getElementById('btn');
        const listEl  = document.getElementById('list');
        const subEl   = document.getElementById('subtitle');

        function fmtNum(v, digits = 2) {
            if (v === null || v === undefined || isNaN(v)) return '—';
            return Number(v).toLocaleString('zh-CN', {
                minimumFractionDigits: digits,
                maximumFractionDigits: digits,
            });
        }
        function fmtVol(v) {
            if (v === null || v === undefined || isNaN(v)) return '—';
            const n = Number(v);
            if (n >= 1e8) return (n / 1e8).toFixed(2) + ' 亿';
            if (n >= 1e4) return (n / 1e4).toFixed(2) + ' 万';
            return n.toFixed(0);
        }
        function pctClass(v) {
            if (v === null || v === undefined || isNaN(v)) return 'flat';
            if (v > 0) return 'up';
            if (v < 0) return 'down';
            return 'flat';
        }
        function pctText(v) {
            if (v === null || v === undefined || isNaN(v)) return '—';
            const sign = v > 0 ? '+' : '';
            return sign + Number(v).toFixed(2) + '%';
        }
        function fmtScore(v) {
            if (v === null || v === undefined || isNaN(v)) return '—';
            return Math.round(Number(v)) + ' 分';
        }
        function starsHtml(stars) {
            if (stars === null || stars === undefined || isNaN(stars)) {
                return '<span class="stars"><span class="off">★★★★★</span></span>';
            }
            const n = Math.max(0, Math.min(5, Math.round(Number(stars))));
            return `<span class="stars">${'★'.repeat(n)}<span class="off">${'★'.repeat(5 - n)}</span></span>`;
        }
        function ratingHtml(s) {
            const text = s['综合评分'] === null || s['综合评分'] === undefined
                ? '无评分'
                : `${fmtScore(s['综合评分'])} · ${s['评级'] || ''}`;
            return `<div class="rating-row">${starsHtml(s['星级'])}<span class="rating-text">${text}</span></div>`;
        }
        function scoreBarHtml(score) {
            const w = (score === null || score === undefined || isNaN(score))
                ? 0 : Math.max(0, Math.min(100, Number(score)));
            return `<div class="bar"><div class="bar-fill" style="width:${w}%"></div></div>`;
        }
        function metricHtml(label, value, valueCls, score) {
            return `
                <div class="metric">
                    <span class="label">${label}</span>
                    <span class="val ${valueCls || ''}">${value}</span>
                    ${scoreBarHtml(score)}
                    <span class="sub">${fmtScore(score)}</span>
                </div>`;
        }

        function renderLoading(msg = '正在获取行情…') {
            listEl.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <div>${msg}</div>
                </div>`;
        }

        function renderEmpty(msg) {
            listEl.innerHTML = `<div class="empty">${msg}</div>`;
        }

        function render(list) {
            if (!list.length) {
                renderEmpty('没有数据');
                return;
            }
            const html = list.map((s, i) => {
                const hasPrice = s['最新价'] !== null && s['最新价'] !== undefined;
                if (!hasPrice) {
                    return `
                        <div class="card" style="animation-delay:${i * 60}ms">
                            <div class="card-top">
                                <div>
                                    <span class="stock-name">${s['名称'] || ''}</span>
                                    <span class="stock-code">${s['代码'] || ''}</span>
                                </div>
                                <span class="na">—</span>
                            </div>
                            <div class="na-hint">实时行情暂不可用</div>
                        </div>`;
                }
                const cls = pctClass(s['涨跌幅']);
                return `
                    <div class="card" style="animation-delay:${i * 60}ms">
                        <div class="card-top">
                            <div>
                                <span class="stock-name">${s['名称'] || ''}</span>
                                <span class="stock-code">${s['代码'] || ''}</span>
                            </div>
                            <div class="quote">
                                <span class="price ${cls}">${fmtNum(s['最新价'])}</span>
                                <span class="pct ${cls}">${pctText(s['涨跌幅'])}</span>
                            </div>
                        </div>
                        ${ratingHtml(s)}
                        <div class="metrics">
                            ${metricHtml('成交量', fmtVol(s['成交量']), '', s['成交量评分'])}
                            ${metricHtml('换手率', fmtNum(s['换手率']) + '%', cls, s['换手率评分'])}
                        </div>
                    </div>`;
            }).join('');
            listEl.innerHTML = html;
        }

        async function load() {
            btn.disabled = true;
            renderLoading('正在获取行情…');
            try {
                const res = await fetch('/api/random-five');
                const data = await res.json();
                if (!data.ok) {
                    renderEmpty(data.msg || '服务暂不可用');
                    subEl.textContent = '加载失败';
                    return;
                }
                render(data.stocks || []);
                subEl.textContent = `命中 ${data.fetched}/${data.requested}`;
            } catch (e) {
                renderEmpty('网络异常，请检查后端是否启动');
                subEl.textContent = '请求失败';
            } finally {
                btn.disabled = false;
            }
        }

        btn.addEventListener('click', load);

        // 页面打开自动加载
        load();
    </script>
</body>
</html>
